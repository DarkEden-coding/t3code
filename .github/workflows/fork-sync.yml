# Nightly: mirror upstream main to the `upstream` branch, merge upstream's newest nightly into `main`,
# let Claude Code resolve conflicts, validate, then fast-forward `main`.
# On failure `main` is left untouched and a `sync-blocked` issue is opened or updated.
name: Fork sync

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 01:00 PST / 02:00 PDT, before fork-release at 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/pingdotgg/t3code.git

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout fork main (full history; merges need it)
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # A PAT or GitHub App token, so the push below triggers fork-release/fork-ci.
          # Pushes made with GITHUB_TOKEN do not trigger other workflows.
          token: ${{ secrets.FORK_BOT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "fork-sync-bot@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main

      - name: Mirror upstream main to the `upstream` branch
        run: |
          # Fast-forward only. If this fails, someone committed to `upstream`; fix by hand.
          git push origin refs/remotes/upstream/main:refs/heads/upstream

      # Merge target: the commit of upstream's newest published nightly, not main HEAD.
      # Upstream publishes a nightly only after its full release pipeline passes, and
      # check-nightly-release.cjs:25-39 requires the commit to be on upstream main.
      - name: Resolve upstream target
        id: delta
        run: |
          tag="$(git ls-remote --tags --refs upstream 'refs/tags/v*-nightly.*' \
            | awk '{print $2}' | sed 's#^refs/tags/##' | sort -V | tail -n 1)"
          git fetch --no-tags upstream "refs/tags/$tag:refs/upstream-nightly/$tag"
          target="$(git rev-parse "refs/upstream-nightly/$tag^{commit}")"
          behind="$(git rev-list --count "HEAD..$target")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "main is $behind commits behind upstream nightly $tag"

      - name: Merge upstream
        id: merge
        if: steps.delta.outputs.behind != '0'
        env:
          TAG: ${{ steps.delta.outputs.tag }}
          TARGET: ${{ steps.delta.outputs.target }}
        run: |
          git checkout -b "sync/$(date -u +%Y%m%d)"
          if git merge --no-ff --no-edit -m "Merge upstream $TAG into main" "$TARGET"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/conflicts.txt"
          fi

      # Install is deferred: a conflicted pnpm-lock.yaml would break it.
      - name: Setup Vite+
        if: steps.delta.outputs.behind != '0'
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Install Claude Code
        if: steps.delta.outputs.behind != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve conflicts with Claude Code
        id: resolve
        if: steps.merge.outputs.conflicts == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat .github/fork/resolve-conflicts.md)" \
            --model claude-opus-5-5 \
            --dangerously-skip-permissions \
            --max-turns 200 \
            --output-format text | tee "$RUNNER_TEMP/claude-resolve.log"
          # The prompt tells Claude to finish the merge commit. Verify it did.
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain." >&2; exit 1
          fi
          if test -f .git/MERGE_HEAD; then
            echo "Merge was not committed." >&2; exit 1
          fi

      - name: Validate
        id: validate
        if: steps.delta.outputs.behind != '0'
        continue-on-error: true
        run: |
          set -o pipefail
          vp install
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
          vp run --filter @t3tools/desktop ensure:electron
          # Checks the fork's own delta against the new upstream: format, lint, knip,
          # typecheck of affected packages and their dependents, tests beside the changes.
          node scripts/check-changed.ts upstream/main 2>&1 | tee "$RUNNER_TEMP/validate.log"
          vp run build:desktop 2>&1 | tee -a "$RUNNER_TEMP/validate.log"

      - name: Fix validation failures with Claude Code (one attempt)
        id: fix
        if: steps.validate.outcome == 'failure'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          tail -c 60000 "$RUNNER_TEMP/validate.log" > "$RUNNER_TEMP/validate-tail.log"
          claude -p "$(cat .github/fork/fix-validation.md)

          Validation log (tail): $RUNNER_TEMP/validate-tail.log" \
            --model claude-opus-5-5 \
            --dangerously-skip-permissions \
            --max-turns 200 \
            --output-format text | tee "$RUNNER_TEMP/claude-fix.log"
          vp install
          node scripts/check-changed.ts upstream/main
          vp run build:desktop

      - name: Land on main
        if: steps.delta.outputs.behind != '0' && (steps.validate.outcome == 'success' || steps.fix.outcome == 'success')
        run: |
          # Fast-forward only: if main moved during the run, fail and retry tomorrow.
          git push origin "HEAD:refs/heads/main"
          git push origin "HEAD:refs/heads/sync/last-good" --force

      # New upstream workflows arrive enabled; they need Blacksmith runners and upstream secrets.
      - name: Disable upstream workflows
        if: steps.delta.outputs.behind != '0' && (steps.validate.outcome == 'success' || steps.fix.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: sh scripts/disable-upstream-workflows.sh "${{ github.repository }}"

      - name: Keep the failed attempt for inspection
        if: failure() && steps.delta.outputs.behind != '0'
        run: |
          git add -A && git commit -qm "WIP: failed sync attempt" || true
          git push origin "HEAD:refs/heads/sync/failed-$(date -u +%Y%m%d)" --force

      - name: Open or update the sync-blocked issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
        run: |
          body="Nightly sync failed on $(date -u +%F). main was not changed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Attempt branch: sync/failed-$(date -u +%Y%m%d)

          Conflicted files:
          $(cat "$RUNNER_TEMP/conflicts.txt" 2>/dev/null || echo none)"
          existing="$(gh issue list --label sync-blocked --state open --json number --jq '.[0].number')"
          if test -n "$existing"; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label sync-blocked --title "Nightly upstream sync blocked" --body "$body"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
